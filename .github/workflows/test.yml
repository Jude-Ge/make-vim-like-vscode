name: Test vimrc

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  vim:
    name: Vim on Linux
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show Vim version
        run: vim --version | head -n 12

      - name: Validate HDL dictionaries
        run: |
          for dictionary in dict/*.dict; do
            LC_ALL=C sort -c "$dictionary"
            test "$(wc -l < "$dictionary")" -eq "$(sort -u "$dictionary" | wc -l)"
          done

      - name: Run headless behavior tests
        run: |
          if ! vim -Nu .vimrc -n -es -S tests/test_vimrc.vim; then
            test -f vim-test-errors.log && cat vim-test-errors.log
            exit 1
          fi
